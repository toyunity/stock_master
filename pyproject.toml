[project]
name = "stock-master"
version = "0.1.0"
description = "한국 주식 실시간 분석·매매조언 PWA (개인용)"
requires-python = ">=3.9"
dependencies = [
    "finance-datareader>=0.9.101",
    "pandas>=2.2",
    "ta>=0.11.0",
    "pyarrow>=15.0",
    "jinja2>=3.1",
    "pydantic-settings>=2.2",
    "feedparser>=6.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.0",
    "httpx>=0.27",              # authlib 토큰 교환에 필요(구 dev→main 승격)
    # 인증 게이트(공개 배포) — Google OAuth2 + TOTP 2차 + 세션 쿠키
    "authlib>=1.6",
    "pyotp>=2.9",
    "itsdangerous>=2.2",        # Starlette SessionMiddleware
    "qrcode>=8.0",             # TOTP 등록 QR(SVG)
    "python-multipart>=0.0.9",  # 2FA 폼(POST) 파싱
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
